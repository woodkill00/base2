services:
  postgres:
    image: mirror.gcr.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d e2e || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: mirror.gcr.io/library/redis@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  workspace-db-role:
    image: mirror.gcr.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_DB_PASSWORD: e2e_workspace_runtime_password
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_workspace_worker_password
      RUNTIME_WORKER_DB_USER: base2_runtime_worker_e2e
      RUNTIME_WORKER_DB_PASSWORD: e2e_runtime_worker_password
      API_RUNTIME_DB_USER: base2_api_runtime_e2e
      API_RUNTIME_DB_PASSWORD: e2e_api_runtime_database_password
      DATA_RIGHTS_WORKER_DB_USER: base2_data_rights_worker_e2e
      DATA_RIGHTS_WORKER_DB_PASSWORD: e2e_data_rights_worker_password
      EMAIL_WORKER_DB_USER: base2_email_worker_e2e
      EMAIL_WORKER_DB_PASSWORD: e2e_email_worker_password
    volumes:
      - ../postgres/bootstrap-workspace-role.sh:/bootstrap-workspace-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/bootstrap-workspace-role.sh']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  api-migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      BASE2_PROCESS_ROLE: migration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      POSTGRES_DB: e2e
      DB_USER: e2e
      DB_PASSWORD: e2e
      API_MIGRATIONS_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      workspace-db-role:
        condition: service_completed_successfully
    entrypoint: ['python', '-m', 'api.scripts.migrate']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  django-migrate:
    build:
      context: ../django
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      SITE_PROFILE: base2-obsidian
      DJANGO_SETTINGS_MODULE: project.settings.production
      DJANGO_SECRET_KEY: e2e_secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: '*'
      DJANGO_ALLOW_ALL_HOSTS: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: e2e
      DB_PASSWORD: e2e
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      RUNTIME_WORKER_DB_USER: base2_runtime_worker_e2e
      API_RUNTIME_DB_USER: base2_api_runtime_e2e
      DATA_RIGHTS_WORKER_DB_USER: base2_data_rights_worker_e2e
      EMAIL_WORKER_DB_USER: base2_email_worker_e2e
    depends_on:
      postgres:
        condition: service_healthy
      workspace-db-role:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
    entrypoint: ['bash', '-lc']
    command: ['python manage.py migrate --noinput']

  # Trusted one-shot fixture, never a request-selected tenant or role API.
  workspace-fixture:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      BASE2_PROCESS_ROLE: migration
      SITE_PROFILE: base2-obsidian
      E2E_WORKSPACE_DISPOSABLE: '1'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: e2e
      DB_PASSWORD: e2e
      CONTENT_WORKSPACE_STORAGE_BACKEND: local
      CONTENT_WORKSPACE_STORAGE_ROOT: /var/lib/base2/content-workspace
      CONTENT_WORKSPACE_STORAGE_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    volumes:
      - ../e2e/support:/e2e-support:ro
      - content_workspace_artifacts:/var/lib/base2/content-workspace
    depends_on:
      django-migrate:
        condition: service_completed_successfully
    command: ['python', '/e2e-support/workspace_fixture.py', 'seed']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      CONTENT_WORKSPACE_STORAGE_BACKEND: local
      CONTENT_WORKSPACE_STORAGE_ROOT: /var/lib/base2/content-workspace
      CONTENT_WORKSPACE_STORAGE_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      POSTGRES_DB: e2e
      DB_USER: base2_api_runtime_e2e
      DB_PASSWORD: e2e_api_runtime_database_password
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_DB_PASSWORD: e2e_workspace_runtime_password
      JWT_SECRET: e2e_jwt_secret
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      OAUTH_STATE_SECRET: e2e_oauth_state
      AUTH_REFRESH_COOKIE: 'true'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: Lax
      FRONTEND_URL: ${E2E_WEB_ORIGIN:-http://localhost:8080}
      CORS_ALLOW_ORIGINS: ${E2E_WEB_ORIGIN:-http://localhost:8080}
    volumes:
      - content_workspace_artifacts:/var/lib/base2/content-workspace
    depends_on:
      workspace-fixture:
        condition: service_completed_successfully
      django-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${E2E_API_PORT:-5001}:5001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import http.client, sys; conn = http.client.HTTPConnection(''localhost'', 5001, timeout=3); conn.request(''GET'', ''/api/health''); r = conn.getresponse(); sys.exit(0 if r.status == 200 else 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  test-support:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      E2E_TEST_MODE: 'true'
      E2E_TEST_KEY: local-e2e-key
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_email_worker_e2e
      DB_PASSWORD: e2e_email_worker_password
    depends_on:
      django-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - uvicorn
      - api.synthetic_support_app:app
      - --host
      - 0.0.0.0
      - --port
      - '5002'
    ports:
      - '127.0.0.1:${E2E_TEST_SUPPORT_PORT:-5002}:5002'
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import http.client, sys; conn = http.client.HTTPConnection(''localhost'', 5002, timeout=3); conn.request(''GET'', ''/synthetic-health''); r = conn.getresponse(); sys.exit(0 if r.status == 200 else 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  celery-worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      BASE2_PROCESS_ROLE: runtime-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_runtime_worker_e2e
      DB_PASSWORD: e2e_runtime_worker_password
      WORKSPACE_DB_USER: base2_runtime_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_runtime_worker_password
      WORKSPACE_WORKER_DB_USER: base2_runtime_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_runtime_worker_password
    volumes:
      - ../shared/config/operations-probes-v1.json:/app/shared/config/operations-probes-v1.json:ro
    depends_on:
      redis:
        condition: service_healthy
      django-migrate:
        condition: service_completed_successfully
    command: ['bash', '-lc', 'celery -A api.tasks.app worker -Q runtime --loglevel=info']

  celery-data-rights-worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      BASE2_PROCESS_ROLE: data-rights-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_data_rights_worker_e2e
      DB_PASSWORD: e2e_data_rights_worker_password
      WORKSPACE_DB_USER: base2_data_rights_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_data_rights_worker_password
    depends_on:
      redis:
        condition: service_healthy
      django-migrate:
        condition: service_completed_successfully
    command: ['bash', '-lc', 'celery -A api.tasks.app worker -Q data-rights --loglevel=info']

  celery-content-worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      BASE2_PROCESS_ROLE: content-worker
      E2E_WORKSPACE_DISPOSABLE: '1'
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      TOKEN_PEPPER: e2e_token_pepper
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_workspace_worker_e2e
      DB_PASSWORD: e2e_workspace_worker_password
      WORKSPACE_DB_USER: base2_workspace_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_workspace_worker_password
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_workspace_worker_password
      CONTENT_WORKSPACE_STORAGE_BACKEND: local
      CONTENT_WORKSPACE_STORAGE_ROOT: /var/lib/base2/content-workspace
      CONTENT_WORKSPACE_STORAGE_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    volumes:
      - ../e2e/support:/e2e-support:ro
      - content_workspace_artifacts:/var/lib/base2/content-workspace
    depends_on:
      workspace-fixture:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      ['celery', '-A', 'api.tasks', 'worker', '-Q', 'content', '-l', 'INFO', '--concurrency=2']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.runtime_heartbeat import _runtime_heartbeat; raise SystemExit(0 if _runtime_heartbeat(''workers:content-worker'', 1)[0] == ''healthy'' else 1)"',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  celery-beat:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      SITE_PROFILE: base2-obsidian
      BASE2_PROCESS_ROLE: runtime-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_runtime_worker_e2e
      DB_PASSWORD: e2e_runtime_worker_password
      WORKSPACE_DB_USER: base2_runtime_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_runtime_worker_password
    depends_on:
      workspace-fixture:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      ['celery', '-A', 'api.tasks', 'beat', '-l', 'INFO', '--schedule=/tmp/celerybeat-schedule']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import os; from celery import Celery; c=Celery(broker=os.environ[''CELERY_BROKER_URL'']).connection(); c.connect(); c.release()"',
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  react-app:
    build:
      context: ../react-app
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        NODE_VERSION: 24.20.0-alpine
        NGINX_VERSION: 1.27.3-alpine
        SITE_PROFILE: base2-obsidian
    ports:
      - '127.0.0.1:${E2E_WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  content_workspace_artifacts:
