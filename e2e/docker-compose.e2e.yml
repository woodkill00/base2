services:
  postgres:
    image: mirror.gcr.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d e2e || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: mirror.gcr.io/library/redis@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  workspace-db-role:
    image: mirror.gcr.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_DB_PASSWORD: e2e_workspace_runtime_password
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_workspace_worker_password
      RUNTIME_WORKER_DB_USER: base2_runtime_worker_e2e
      RUNTIME_WORKER_DB_PASSWORD: e2e_runtime_worker_password
      DATA_RIGHTS_WORKER_DB_USER: base2_data_rights_worker_e2e
      DATA_RIGHTS_WORKER_DB_PASSWORD: e2e_data_rights_worker_password
      EMAIL_WORKER_DB_USER: base2_email_worker_e2e
      EMAIL_WORKER_DB_PASSWORD: e2e_email_worker_password
    volumes:
      - ../postgres/bootstrap-workspace-role.sh:/bootstrap-workspace-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/bootstrap-workspace-role.sh']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  django-migrate:
    build:
      context: ../django
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.production
      DJANGO_SECRET_KEY: e2e_secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: '*'
      DJANGO_ALLOW_ALL_HOSTS: 'true'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: e2e
      DB_PASSWORD: e2e
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      RUNTIME_WORKER_DB_USER: base2_runtime_worker_e2e
      DATA_RIGHTS_WORKER_DB_USER: base2_data_rights_worker_e2e
      EMAIL_WORKER_DB_USER: base2_email_worker_e2e
    depends_on:
      postgres:
        condition: service_healthy
      workspace-db-role:
        condition: service_completed_successfully
    entrypoint: ['bash', '-lc']
    command: ['python manage.py migrate --noinput']

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      POSTGRES_DB: e2e
      DB_USER: e2e
      DB_PASSWORD: e2e
      WORKSPACE_DB_USER: base2_workspace_runtime_e2e
      WORKSPACE_DB_PASSWORD: e2e_workspace_runtime_password
      WORKSPACE_WORKER_DB_USER: base2_workspace_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_workspace_worker_password
      JWT_SECRET: e2e_jwt_secret
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      OAUTH_STATE_SECRET: e2e_oauth_state
      AUTH_REFRESH_COOKIE: 'true'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: Lax
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOW_ORIGINS: http://localhost:8080
      E2E_TEST_MODE: 'true'
      E2E_TEST_KEY: local-e2e-key
    depends_on:
      django-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '5001:5001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import http.client, sys; conn = http.client.HTTPConnection(''localhost'', 5001, timeout=3); conn.request(''GET'', ''/api/health''); r = conn.getresponse(); sys.exit(0 if r.status == 200 else 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  celery-worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      BASE2_PROCESS_ROLE: runtime-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_runtime_worker_e2e
      DB_PASSWORD: e2e_runtime_worker_password
      WORKSPACE_DB_USER: base2_runtime_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_runtime_worker_password
      WORKSPACE_WORKER_DB_USER: base2_runtime_worker_e2e
      WORKSPACE_WORKER_DB_PASSWORD: e2e_runtime_worker_password
    depends_on:
      redis:
        condition: service_healthy
      django-migrate:
        condition: service_completed_successfully
    command: ['bash', '-lc', 'celery -A api.tasks.app worker -Q runtime --loglevel=info']

  celery-data-rights-worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        PYTHON_VERSION: 3.12-slim-bookworm
    environment:
      ENV: test
      BASE2_PROCESS_ROLE: data-rights-worker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TOKEN_PEPPER: e2e_token_pepper
      IDENTITY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: /app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: e2e
      DB_USER: base2_data_rights_worker_e2e
      DB_PASSWORD: e2e_data_rights_worker_password
      WORKSPACE_DB_USER: base2_data_rights_worker_e2e
      WORKSPACE_DB_PASSWORD: e2e_data_rights_worker_password
    depends_on:
      redis:
        condition: service_healthy
      django-migrate:
        condition: service_completed_successfully
    command: ['bash', '-lc', 'celery -A api.tasks.app worker -Q data-rights --loglevel=info']

  react-app:
    build:
      context: ../react-app
      dockerfile: Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: mirror.gcr.io/library
        NODE_VERSION: 24.20.0-alpine
        NGINX_VERSION: 1.27.3-alpine
        REACT_APP_API_URL: http://localhost:5001/api
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
