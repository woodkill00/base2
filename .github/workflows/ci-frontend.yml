name: CI (frontend)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.mode }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify exact changes using base policy
        id: scope
        working-directory: .
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ || ! "$HEAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Frontend scope: full (comparison unavailable).' >> "$GITHUB_STEP_SUMMARY"
          elif git cat-file -e "$BASE_COMMIT:scripts/python/frontend_ci_scope.py" 2>/dev/null; then
            policy="$RUNNER_TEMP/base2-frontend-ci-scope.py"
            git show "$BASE_COMMIT:scripts/python/frontend_ci_scope.py" > "$policy"
            python3 "$policy" --base "$BASE_COMMIT" --head "$HEAD_COMMIT" --root "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Frontend scope: full (base policy unavailable).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.scope.outputs.mode == 'full'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install
        id: install
        if: steps.scope.outputs.mode == 'full'
        run: npm ci --legacy-peer-deps

      - name: Lint
        if: steps.scope.outputs.mode == 'full'
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outputs.mode == 'full'
        run: npm exec tsc -- --noEmit

      - name: Live acceptance policy regressions (no provider or credentials)
        if: steps.scope.outputs.mode == 'full'
        run: node --test e2e/live/acceptance-contract.test.mjs

      - name: Test
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:ci

      - name: Upload coverage artifact
        if: steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-frontend
          path: react-app/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Build
        id: build
        if: steps.scope.outputs.mode == 'full'
        run: npm run build

      - name: Build Storybook tooling compatibility
        if: steps.scope.outputs.mode == 'full'
        timeout-minutes: 10
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: npm run build-storybook

      - name: Install layout browsers
        id: browsers
        if: steps.scope.outputs.mode == 'full'
        run: npm exec playwright -- install --with-deps chromium firefox webkit

      - name: Install approved-reference fonts
        id: fonts
        if: steps.scope.outputs.mode == 'full'
        run: |
          sudo apt-get install --no-install-recommends -y fonts-ubuntu=0.869+git20240321-0ubuntu1
          fc-cache -f
          test "$(fc-match -f '%{family}' Ubuntu)" = Ubuntu
          dpkg-query -W fonts-ubuntu

      # Run independent browser diagnostics sequentially even after an assertion
      # fails, but never after setup failure. Original failing exits remain fatal;
      # the terminal aggregate also rejects skipped/incomplete required suites.
      - name: Account, settings foundation and existing interaction contracts
        id: account_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        run: npm run test:account-e2e -- --output=../.artifacts/settings-121/account

      - name: Settings responsive release matrix
        id: settings_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        run: npm run test:settings-release -- --output=../.artifacts/settings-121/release

      - name: Upload settings acceptance evidence
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: settings-121
          path: .artifacts/settings-121
          if-no-files-found: warn
          retention-days: 7

      - name: Workspace responsive release matrix
        id: workspace_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        run: npm run test:workspace-release -- --output=../.artifacts/workspace-124

      - name: Upload workspace acceptance evidence
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: workspace-124
          path: .artifacts/workspace-124
          if-no-files-found: error
          retention-days: 7

      - name: Genuine forced-color media diagnostics
        id: media_hc_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        run: npm run test:media-release -- --project=chromium-high-contrast --reporter=line --output=../.artifacts/forced-colors-ci-${{ github.run_id }}-${{ github.run_attempt }}-media

      - name: Genuine forced-color operations diagnostics
        id: operations_hc_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Partial diagnostics must not rewrite the accepted full-matrix receipt.
          receipt_before="$(sha256sum ../specs/106-production-readiness-program/operations-visual-runner.json)"
          status=0
          npm run test:operations-release -- --project=chromium-high-contrast --reporter=line --output=../.artifacts/forced-colors-ci-${{ github.run_id }}-${{ github.run_attempt }}-operations || status=$?
          receipt_check=0
          receipt_after="$(sha256sum ../specs/106-production-readiness-program/operations-visual-runner.json)" || receipt_check=$?
          if [[ "$receipt_check" != 0 || "$receipt_before" != "$receipt_after" ]]; then
            echo "::error::Partial operations diagnostics modified the accepted full-matrix receipt."
            if [[ "$status" == 0 ]]; then status=1; fi
          fi
          exit "$status"

      - name: Retain targeted forced-color diagnostics
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: forced-color-diagnostics
          path: |
            .artifacts/forced-colors-ci-${{ github.run_id }}-${{ github.run_attempt }}-media
            .artifacts/forced-colors-ci-${{ github.run_id }}-${{ github.run_attempt }}-operations
          if-no-files-found: warn
          retention-days: 7

      - name: Shared layout contracts and visual evidence
        id: layout_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        env:
          LAYOUT_ATTEMPT: ci-${{ github.run_id }}-${{ github.run_attempt }}-layout
        run: npm exec playwright -- test --config=playwright.layout.config.mjs

      - name: Approved Volcano design preservation
        id: volcano_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        env:
          LAYOUT_ATTEMPT: ci-${{ github.run_id }}-${{ github.run_attempt }}-volcano
        run: npm exec playwright -- test --config=playwright.volcano.config.mjs

      - name: Volcano user journey states
        id: journeys_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        env:
          JOURNEY_ATTEMPT: ci-${{ github.run_id }}-${{ github.run_attempt }}-journeys
        run: npm exec playwright -- test --config=playwright.journeys.config.mjs

      - name: Enabled optional module journeys
        id: module_journeys_acceptance
        if: >-
          always() && steps.scope.outputs.mode == 'full' && steps.install.outcome == 'success'
          && steps.build.outcome == 'success' && steps.browsers.outcome == 'success'
          && steps.fonts.outcome == 'success'
        env:
          JOURNEY_ATTEMPT: ci-${{ github.run_id }}-${{ github.run_attempt }}-modules
        run: npm exec playwright -- test --config=playwright.modules-journeys.config.mjs

      - name: Upload user journey evidence
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: user-journeys-113
          path: |
            .artifacts/journeys-ci-${{ github.run_id }}-${{ github.run_attempt }}-journeys
            .artifacts/journeys-ci-${{ github.run_id }}-${{ github.run_attempt }}-modules
          if-no-files-found: warn
          retention-days: 7

      - name: Upload layout evidence
        if: always() && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: layout-109
          path: .artifacts/layout-109
          if-no-files-found: error
          retention-days: 7

      - name: Build Storybook
        if: steps.scope.outputs.mode == 'full'
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: storybook-static
          path: react-app/storybook-static
          if-no-files-found: error
          retention-days: 7

      - name: Require every browser acceptance suite
        id: browser_acceptance
        if: always() && steps.scope.outputs.mode == 'full'
        shell: bash
        env:
          ACCOUNT: ${{ steps.account_acceptance.outcome }}
          SETTINGS: ${{ steps.settings_acceptance.outcome }}
          WORKSPACE: ${{ steps.workspace_acceptance.outcome }}
          MEDIA_HC: ${{ steps.media_hc_acceptance.outcome }}
          OPERATIONS_HC: ${{ steps.operations_hc_acceptance.outcome }}
          LAYOUT: ${{ steps.layout_acceptance.outcome }}
          VOLCANO: ${{ steps.volcano_acceptance.outcome }}
          JOURNEYS: ${{ steps.journeys_acceptance.outcome }}
          MODULE_JOURNEYS: ${{ steps.module_journeys_acceptance.outcome }}
        run: |
          set -euo pipefail
          status=0
          printf '## Browser acceptance\n\n| Suite | Outcome |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for suite in ACCOUNT SETTINGS WORKSPACE MEDIA_HC OPERATIONS_HC LAYOUT VOLCANO JOURNEYS MODULE_JOURNEYS; do
            outcome="${!suite:-missing}"
            printf '| %s | %s |\n' "$suite" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$outcome" != success ]]; then
              echo "::error::$suite browser acceptance did not pass ($outcome). Setup-blocked suites have no browser evidence."
              status=1
            fi
          done
          exit "$status"

  chromatic:
    name: Publish Storybook to Chromatic
    runs-on: ubuntu-latest
    needs: frontend
    if: ${{ needs.frontend.outputs.scope == 'full' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Skip Chromatic (missing token)
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        run: echo "CHROMATIC_PROJECT_TOKEN is not set; skipping Chromatic publish."

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@a01e849cbc1f51ec5743358b4d7f9a1eadadf44e
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: react-app
          buildScriptName: build-storybook
