name: CI (frontend)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm exec tsc -- --noEmit

      - name: Test
        run: npm run test:ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-frontend
          path: react-app/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Install layout browsers
        run: npm exec playwright -- install --with-deps chromium firefox webkit

      - name: Shared layout contracts and visual evidence
        run: npm exec playwright -- test --config=playwright.layout.config.mjs

      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: layout-109
          path: .artifacts/layout-109
          if-no-files-found: error
          retention-days: 7

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: storybook-static
          path: react-app/storybook-static
          if-no-files-found: error
          retention-days: 7

  chromatic:
    name: Publish Storybook to Chromatic
    runs-on: ubuntu-latest
    needs: frontend
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Skip Chromatic (missing token)
        if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
        run: echo "CHROMATIC_PROJECT_TOKEN is not set; skipping Chromatic publish."

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@a01e849cbc1f51ec5743358b4d7f9a1eadadf44e
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: react-app
          buildScriptName: build-storybook
