name: security

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate SBOMs with Syft
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan with Grype
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: |
            sbom.cdx.json
            grype.sarif
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.1
          cache: npm

      - name: Install root deps
        run: npm ci --legacy-peer-deps

      - name: Install frontend deps (prod only)
        run: cd react-app && npm ci --omit=dev --legacy-peer-deps

      - name: Audit frontend deps
        run: cd react-app && npm audit --omit=dev --audit-level=high --json > ../frontend-npm-audit.json

      - name: Upload npm audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit
          path: frontend-npm-audit.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: |
          set +e
          pip-audit -r api/requirements.txt --format=json --output=api-pip-audit.json
          api_status=$?
          pip-audit -r django/requirements.txt --format=json --output=django-pip-audit.json
          django_status=$?
          set -e
          if [ "$api_status" -ne 0 ] || [ "$django_status" -ne 0 ]; then exit 1; fi

      - name: Upload pip audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pip-audit
          path: |
            api-pip-audit.json
            django-pip-audit.json

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        with:
          config-path: .gitleaks.toml
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep CLI
        run: python -m pip install --upgrade pip semgrep
      - name: Run Semgrep SAST
        run: semgrep --config .semgrep.yml --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  node-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.1
          cache: npm
      - name: Install license-checker
        run: npm install -g license-checker
      - name: Check Node licenses
        run: |
          set +e
          license-checker --production --json --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-3-Clause;ISC" > root-node-licenses.json
          root_status=$?
          cd react-app
          license-checker --production --json --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-3-Clause;ISC" > ../react-node-licenses.json
          react_status=$?
          set -e
          if [ "$root_status" -ne 0 ] || [ "$react_status" -ne 0 ]; then exit 1; fi
      - name: Upload Node license results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-licenses
          path: |
            root-node-licenses.json
            react-node-licenses.json

  python-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pip-licenses
        run: python -m pip install --upgrade pip pip-licenses
      - name: Generate API licenses
        run: |
          python -m venv .license-api
          .license-api/bin/pip install -r api/requirements.txt pip-licenses
          .license-api/bin/pip-licenses --from=mixed --format=json --output-file api-licenses.json
      - name: Generate Django licenses
        run: |
          python -m venv .license-django
          .license-django/bin/pip install -r django/requirements.txt pip-licenses
          .license-django/bin/pip-licenses --from=mixed --format=json --output-file django-licenses.json
      - name: Validate licenses (allowlist)
        run: |
          python - <<'PY'
          import json, sys, os
          # Allow common permissive licenses (SPDX + common names)
          allow_tokens = {
            "mit",
            "apache-2.0",
            "apache software license",
            "bsd",
            "bsd-3-clause",
            "isc",
            "psf-2.0",
            "python software foundation license",
            "mpl-2.0",
            "mozilla public license 2.0",
          }
          bad = []
          for path in ("api-licenses.json", "django-licenses.json"):
            if not os.path.exists(path):
              print(f"Warning: {path} not found")
              continue
            with open(path, encoding="utf-8") as f:
              data = json.load(f)
            for row in data:
              lic = (row.get("License") or "").strip()
              name = row.get("Name") or ""
              lic_l = lic.lower()
              if lic and all(tok not in lic_l for tok in allow_tokens):
                bad.append((name, lic))
          if bad:
            print("Disallowed licenses:")
            for name, lic in bad:
              print(f" - {name}: {lic}")
          sys.exit(1 if bad else 0)
          PY
      - name: Upload Python license results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-licenses
          path: |
            api-licenses.json
            django-licenses.json
