name: security

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate SBOMs with Syft
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan with Grype
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Normalize SBOM result
        if: always()
        run: python scripts/python/security_result_adapter.py --family sbom --format cyclonedx --tool syft --source-commit "$GITHUB_SHA" --input sbom.cdx.json --output sbom.normalized.json

      - name: Normalize Grype result
        if: always()
        run: python scripts/python/security_result_adapter.py --family dependency --format sarif --tool grype --source-commit "$GITHUB_SHA" --input "${{ steps.grype.outputs.sarif }}" --output grype.normalized.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: |
            sbom.cdx.json
            ${{ steps.grype.outputs.sarif }}
            sbom.normalized.json
            grype.normalized.json
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install root deps
        run: npm ci --legacy-peer-deps

      - name: Install frontend deps (prod only)
        run: cd react-app && npm ci --omit=dev --legacy-peer-deps

      - name: Audit frontend deps
        run: cd react-app && npm audit --omit=dev --audit-level=high --json > ../frontend-npm-audit.json

      - name: Normalize npm audit result
        if: always()
        run: python scripts/python/security_result_adapter.py --family dependency --format npm-audit --tool npm-audit --source-commit "$GITHUB_SHA" --input frontend-npm-audit.json --output frontend-npm-audit.normalized.json

      - name: Upload npm audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-audit
          path: |
            frontend-npm-audit.json
            frontend-npm-audit.normalized.json

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies
        run: |
          set +e
          pip-audit -r api/requirements.txt --format=json --output=api-pip-audit.json
          api_status=$?
          pip-audit -r django/requirements.txt --format=json --output=django-pip-audit.json
          django_status=$?
          set -e
          if [ "$api_status" -ne 0 ] || [ "$django_status" -ne 0 ]; then exit 1; fi

      - name: Normalize pip audit results
        if: always()
        run: |
          python scripts/python/security_result_adapter.py --family dependency --format pip-audit --tool pip-audit-api --source-commit "$GITHUB_SHA" --input api-pip-audit.json --output api-pip-audit.normalized.json
          python scripts/python/security_result_adapter.py --family dependency --format pip-audit --tool pip-audit-django --source-commit "$GITHUB_SHA" --input django-pip-audit.json --output django-pip-audit.normalized.json

      - name: Upload pip audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pip-audit
          path: |
            api-pip-audit.json
            django-pip-audit.json
            api-pip-audit.normalized.json
            django-pip-audit.normalized.json

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Normalize Gitleaks result
        if: always()
        run: python scripts/python/security_result_adapter.py --family secret --format sarif --tool gitleaks --source-commit "$GITHUB_SHA" --input results.sarif --output gitleaks.normalized.json

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-sarif
          path: |
            results.sarif
            gitleaks.normalized.json

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep CLI
        run: python -m pip install --upgrade pip semgrep
      - name: Run Semgrep SAST
        run: semgrep --config .semgrep.yml --sarif --output semgrep.sarif
      - name: Normalize Semgrep result
        if: always()
        run: python scripts/python/security_result_adapter.py --family sast --format sarif --tool semgrep --source-commit "$GITHUB_SHA" --input semgrep.sarif --output semgrep.normalized.json
      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semgrep-sarif
          path: |
            semgrep.sarif
            semgrep.normalized.json

  node-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install license-checker
        run: npm install -g license-checker
      - name: Install locked Node dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix react-app --omit=dev --legacy-peer-deps
      - name: Check Node licenses
        run: |
          license-checker --production --json --excludePrivatePackages > root-node-licenses.json
          cd react-app
          license-checker --production --json --excludePrivatePackages > ../react-node-licenses.json
          cd ..
          python scripts/python/validate_supply_chain_policy.py --kind npm-license --input react-node-licenses.json --output react-node-licenses.policy.json
      - name: Upload Node license results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-licenses
          path: |
            root-node-licenses.json
            root-node-licenses.policy.json
            react-node-licenses.json
            react-node-licenses.policy.json

  python-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pip-licenses
        run: python -m pip install --upgrade pip pip-licenses
      - name: Generate API licenses
        run: |
          python -m venv .license-api
          .license-api/bin/pip install -r api/requirements.txt pip-licenses
          .license-api/bin/pip-licenses --from=mixed --format=json --output-file api-licenses.json
      - name: Generate Django licenses
        run: |
          python -m venv .license-django
          .license-django/bin/pip install -r django/requirements.txt pip-licenses
          .license-django/bin/pip-licenses --from=mixed --format=json --output-file django-licenses.json
      - name: Validate licenses (allowlist)
        run: |
          python scripts/python/validate_supply_chain_policy.py --kind python-license --input api-licenses.json --output api-licenses.policy.json
          python scripts/python/validate_supply_chain_policy.py --kind python-license --input django-licenses.json --output django-licenses.policy.json
      - name: Upload Python license results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-licenses
          path: |
            api-licenses.json
            api-licenses.policy.json
            django-licenses.json
            django-licenses.policy.json

  supply-chain-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate license, package, provenance, and generated-artifact policy
        run: |
          python -m unittest scripts.tests.test_supply_chain_policy
          python scripts/python/validate_supply_chain_policy.py --output supply-chain-policy.json
      - name: Upload supply-chain policy result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-policy
          path: supply-chain-policy.json
