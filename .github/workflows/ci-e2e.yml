name: CI (e2e)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner-shell: [bash, pwsh]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npm run install:browsers

      - name: Run isolated real-service acceptance (Bash)
        if: matrix.runner-shell == 'bash'
        shell: bash
        run: bash scripts/bash/e2e-isolated.sh

      - name: Run isolated real-service acceptance (PowerShell)
        if: matrix.runner-shell == 'pwsh'
        shell: pwsh
        run: ./scripts/powershell/e2e-isolated.ps1

      - name: Upload real-service evidence (including successful runs)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: e2e-real-service-evidence-${{ matrix.runner-shell }}
          path: |
            e2e/artifacts
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7
