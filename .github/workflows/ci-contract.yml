name: CI (contract)

on:
  pull_request:
  push:

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
          python -m pip install pyyaml

      - name: Check contract vs runtime
        run: |
          python scripts/python/contract_check.py --contract specs/001-django-fastapi-react/contracts/openapi.yaml
