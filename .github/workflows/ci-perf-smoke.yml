name: CI (perf-smoke)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main']
  schedule:
    - cron: '0 6 * * *'

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Warmup HEAD to base URL
        run: |
          python - <<'PY'
          import os, requests
          base = os.getenv('PERF_BASE_URL','https://woodkilldev.com')
          try:
            requests.head(base, timeout=10)
          except Exception as e:
            print(f"WARN: warmup failed: {e}")
          PY
      - name: Perf smoke
        env:
          PERF_BASE_URL: https://woodkilldev.com
          PERF_P95_BUDGET_MS: '5000'
          PERF_SAMPLES: '10'
          PERF_INSECURE: '1'
        run: python scripts/python/perf_smoke.py
