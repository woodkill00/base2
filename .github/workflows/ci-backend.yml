name: CI (backend)

on:
  pull_request:
  push:

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, django]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.service }}" = "api" ]; then
            python -m pip install -r api/requirements.txt
          else
            python -m pip install -r django/requirements.txt
          fi
          python -m pip install ruff mypy

      - name: Ruff (lint)
        if: matrix.service == 'api'
        run: ruff check .

      - name: Mypy (typecheck)
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            mypy api
          else
            mypy --exclude '.*/migrations/.*' django
          fi

      - name: Pytest (unit only, with coverage)
        env:
          DJANGO_SETTINGS_MODULE: project.settings.test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            pytest -q -m "not integration" --cov=api --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=50 -c api/pytest.ini api
          else
            cd django
            pytest -q -m "not integration" --cov=project --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=60 -c pytest.ini .
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service == 'api' && 'coverage.xml' || 'django/coverage.xml' }}
          if-no-files-found: error
          retention-days: 7
      - name: Check Django migrations
        if: matrix.service == 'django'
        working-directory: django
        run: |
          python manage.py makemigrations --check --dry-run

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: public.ecr.aws/docker/library/redis@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r django/requirements.txt

      - name: Run Django migrations (schema owner)
        env:
          DJANGO_SETTINGS_MODULE: project.settings.production
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
        working-directory: django
        run: |
          python manage.py migrate api_schema --noinput

      - name: Start Celery worker
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          nohup python -m celery -A api.tasks.app worker --loglevel=info &
          sleep 5
      - name: Run API integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          cd api
          pytest -q -m integration --cov=api --cov-append --cov-report=term -c pytest.ini
