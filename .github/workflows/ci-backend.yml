name: CI (backend)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, django]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.service }}" = "api" ]; then
            python -m pip install -r requirements-dev-api.txt
          else
            python -m pip install -r requirements-dev-django.txt
          fi
          python -m pip check

      - name: Ruff (lint)
        if: matrix.service == 'api'
        run: python -m ruff check api

      - name: Mypy (typecheck)
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            python -m mypy api
          else
            python -m mypy --exclude '.*/migrations/.*' django
          fi

      - name: Pytest (unit only, with coverage)
        env:
          DJANGO_SETTINGS_MODULE: project.settings.test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            pytest -q -m "not integration" --cov=api --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=50 -c api/pytest.ini api
          else
            cd django
            pytest -q -m "not integration" --cov=project --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=60 -c pytest.ini .
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service == 'api' && 'coverage.xml' || 'django/coverage.xml' }}
          if-no-files-found: error
          retention-days: 7
      - name: Check Django migrations
        if: matrix.service == 'django'
        working-directory: django
        run: |
          python manage.py makemigrations --check --dry-run

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase" --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r django/requirements.txt

      - name: Bootstrap bounded database roles
        env:
          DB_HOST: localhost
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase
          WORKSPACE_DB_USER: ci_workspace_runtime
          WORKSPACE_DB_PASSWORD: ci_workspace_runtime_password_001
          WORKSPACE_WORKER_DB_USER: ci_workspace_worker
          WORKSPACE_WORKER_DB_PASSWORD: ci_workspace_worker_password_002
          RUNTIME_WORKER_DB_USER: ci_runtime_worker
          RUNTIME_WORKER_DB_PASSWORD: ci_runtime_worker_password_003
          API_RUNTIME_DB_USER: ci_api_runtime
          API_RUNTIME_DB_PASSWORD: ci_api_runtime_password_004
          DATA_RIGHTS_WORKER_DB_USER: ci_data_rights_worker
          DATA_RIGHTS_WORKER_DB_PASSWORD: ci_data_rights_worker_password_005
          EMAIL_WORKER_DB_USER: ci_email_worker
          EMAIL_WORKER_DB_PASSWORD: ci_email_worker_password_006
        run: |
          command -v psql
          /bin/sh postgres/bootstrap-workspace-role.sh

      - name: Run API migrations (schema owner)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
          API_MIGRATIONS_ENABLED: 'true'
        run: python -m api.scripts.migrate

      - name: Run all Django migrations (schema owner)
        env:
          DJANGO_SETTINGS_MODULE: project.settings.production
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
          WORKSPACE_DB_USER: ci_workspace_runtime
          WORKSPACE_WORKER_DB_USER: ci_workspace_worker
          RUNTIME_WORKER_DB_USER: ci_runtime_worker
          API_RUNTIME_DB_USER: ci_api_runtime
          DATA_RIGHTS_WORKER_DB_USER: ci_data_rights_worker
          EMAIL_WORKER_DB_USER: ci_email_worker
        working-directory: django
        run: |
          python manage.py migrate --noinput

      - name: Start Celery worker
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          nohup python -m celery -A api.tasks.app worker --loglevel=info &
          sleep 5
      - name: Run API integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mydatabase
          DB_USER: myuser
          DB_PASSWORD: mypassword
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          API_RUNTIME_DB_USER: ci_api_runtime
          API_RUNTIME_DB_PASSWORD: ci_api_runtime_password_004
          EMAIL_WORKER_DB_USER: ci_email_worker
          EMAIL_WORKER_DB_PASSWORD: ci_email_worker_password_006
        run: |
          cd api
          pytest -q -m integration --ignore=tests/test_email_outbox.py --cov=api --cov-append --cov-report=term -c pytest.ini
          DB_USER="$API_RUNTIME_DB_USER" DB_PASSWORD="$API_RUNTIME_DB_PASSWORD" \
            pytest -q -m integration tests/test_email_outbox.py -c pytest.ini
