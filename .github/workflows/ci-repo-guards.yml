name: CI (repo guards)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate compact assurance plan
        if: github.event_name == 'pull_request'
        run: python3 scripts/python/assurance_orchestrator.py plan --tier standard --base '${{ github.event.pull_request.base.sha }}' --json

      - name: Repo guard checks
        run: |
          node scripts/validate-command-matrix.js
          node scripts/guard-shell-parity.js
          pwsh -Command '$t=Measure-Command { node scripts/guard-shell-parity.js }; if ($t.TotalSeconds -gt 30) { throw "Guard exceeded 30s" }'
          chmod +x scripts/bash/repo_guard.sh
          bash scripts/bash/repo_guard.sh
