services:
  # React App Service (SPA)
  react-app:
    build:
      context: ./react-app
      dockerfile: Dockerfile
      args:
        - NODE_VERSION=${REACT_APP_NODE_VERSION}
        - REACT_APP_API_URL=https://${WEBSITE_DOMAIN:-localhost}/api
        - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID}
        - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
    container_name: ${COMPOSE_PROJECT_NAME}_react-app
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://${WEBSITE_DOMAIN:-localhost}/api
      - REACT_APP_GOOGLE_CLIENT_ID=${REACT_APP_GOOGLE_CLIENT_ID}
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
    networks: [app_network]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx
      - /var/run/nginx
      - /var/log/nginx
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/ || exit 1']
    mem_limit: 256m
    cpus: '0.5'

  # FastAPI API (Option 1: native /api/* surface)
  api:
    image: ${COMPOSE_PROJECT_NAME}_api:${DEPLOY_EXPECTED_COMMIT:-local}
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_api
    volumes:
      # Mount external OpenAPI contract for runtime contract checks
      - ./specs/001-django-fastapi-react/contracts:/app/specs/001-django-fastapi-react/contracts:ro
      - content_workspace_artifacts:/var/lib/base2/content-workspace
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
      - ${CONTENT_WORKSPACE_S3_ACCESS_KEY_FILE_HOST:-/dev/null}:/run/secrets/content-s3-access-key:ro
      - ${CONTENT_WORKSPACE_S3_SECRET_KEY_FILE_HOST:-/dev/null}:/run/secrets/content-s3-secret-key:ro
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - BASE2_PROCESS_ROLE=api
      - PORT=${FASTAPI_PORT}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${API_RUNTIME_DB_USER}
      - DB_PASSWORD=${API_RUNTIME_DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - WORKSPACE_DB_USER=${WORKSPACE_DB_USER}
      - WORKSPACE_DB_PASSWORD=${WORKSPACE_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_PEPPER=${TOKEN_PEPPER}
      - IDENTITY_ENCRYPTION_KEY=${IDENTITY_ENCRYPTION_KEY}
      - CONTENT_WORKSPACE_STORAGE_ROOT=${CONTENT_WORKSPACE_STORAGE_ROOT}
      - CONTENT_WORKSPACE_STORAGE_KEY=${CONTENT_WORKSPACE_STORAGE_KEY}
      - CONTENT_WORKSPACE_STORAGE_BACKEND=${CONTENT_WORKSPACE_STORAGE_BACKEND:-local}
      - CONTENT_WORKSPACE_S3_ENDPOINT=${CONTENT_WORKSPACE_S3_ENDPOINT:-}
      - CONTENT_WORKSPACE_S3_BUCKET=${CONTENT_WORKSPACE_S3_BUCKET:-}
      - CONTENT_WORKSPACE_S3_REGION=${CONTENT_WORKSPACE_S3_REGION:-}
      - CONTENT_WORKSPACE_S3_ALLOWED_HOSTS=${CONTENT_WORKSPACE_S3_ALLOWED_HOSTS:-}
      - CONTENT_WORKSPACE_S3_ACCESS_KEY_FILE=/run/secrets/content-s3-access-key
      - CONTENT_WORKSPACE_S3_SECRET_KEY_FILE=/run/secrets/content-s3-secret-key
      - OPERATIONS_ALERTS_ENABLED=${OPERATIONS_ALERTS_ENABLED:-false}
      - OPERATIONS_ALERT_INTEGRITY_KEY_FILE=${OPERATIONS_ALERT_INTEGRITY_KEY_FILE:-}
      - OPERATIONS_ALERT_RECEIPT_KEY_FILE=${OPERATIONS_ALERT_RECEIPT_KEY_FILE:-}
      - OPERATIONS_ALERT_WEBHOOK_URL_FILE=${OPERATIONS_ALERT_WEBHOOK_URL_FILE:-}
      - OPERATIONS_RECEIPT_INTEGRITY_KEY_FILE=${OPERATIONS_RECEIPT_INTEGRITY_KEY_FILE:-}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [app_network]
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import os, http.client, sys; p=int(os.environ.get(\"PORT\", \"8000\")); c=http.client.HTTPConnection(\"localhost\", p, timeout=3); c.request(\"GET\", \"/api/health\"); r=c.getresponse(); sys.exit(0 if r.status==200 else 1)"',
        ]
    mem_limit: 512m
    cpus: '0.75'

  # Explicit owner-scoped API schema migration process. This profile is never
  # part of request serving and is started only by the operator migration gate.
  api-migrate:
    image: ${COMPOSE_PROJECT_NAME}_api:${DEPLOY_EXPECTED_COMMIT:-local}
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    profiles: [tools]
    container_name: ${COMPOSE_PROJECT_NAME}_api-migrate
    environment:
      - ENV=${ENV:-development}
      - BASE2_PROCESS_ROLE=migration
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - API_MIGRATIONS_ENABLED=true
    volumes:
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
      workspace-db-role:
        condition: service_completed_successfully
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      disable: true

  # Django (schema owner + admin)
  django:
    build:
      context: ./django
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${DJANGO_PYTHON_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_django
    environment:
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - DJANGO_SETTINGS_MODULE=project.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      # Django superuser bootstrap (used by `python -m project.create_superuser` in django/Dockerfile)
      - DJANGO_SUPERUSER_NAME=${DJANGO_SUPERUSER_NAME}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - WORKSPACE_DB_USER=${WORKSPACE_DB_USER}
      - WORKSPACE_WORKER_DB_USER=${WORKSPACE_WORKER_DB_USER}
      - RUNTIME_WORKER_DB_USER=${RUNTIME_WORKER_DB_USER}
      - API_RUNTIME_DB_USER=${API_RUNTIME_DB_USER}
      - DATA_RIGHTS_WORKER_DB_USER=${DATA_RIGHTS_WORKER_DB_USER}
      - EMAIL_WORKER_DB_USER=${EMAIL_WORKER_DB_USER}
      - PORT=${DJANGO_PORT}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
      workspace-db-role:
        condition: service_completed_successfully
    volumes:
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
      - django_static:/app/static
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import os, http.client, sys; p=int(os.environ.get(''PORT'', ''8000'')); c=http.client.HTTPConnection(''localhost'', p, timeout=3); c.request(''GET'', ''/internal/health''); r=c.getresponse(); sys.exit(0 if r.status==200 else 1)"',
        ]
    mem_limit: 512m
    cpus: '0.75'

  # 🔹 Standalone NGINX (RESTORED)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        - NGINX_VERSION=${NGINX_VERSION}
        - NGINX_PORT=${NGINX_PORT}
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    environment:
      - NGINX_PORT=${NGINX_PORT}
    networks: [app_network]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx
      - /var/run/nginx
      - /var/log/nginx
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:${NGINX_PORT}/ > /dev/null || exit 1']
    mem_limit: 128m
    cpus: '0.5'

  media-inspector-spool-init:
    build:
      context: ./api
      dockerfile: Dockerfile.media-inspector
    profiles: [media-scan, celery]
    platform: linux/amd64
    user: '0:0'
    entrypoint: ['/usr/bin/python']
    command: ['/app/api/scripts/media_inspector_spool_init.py']
    network_mode: none
    volumes:
      - media_inspector_spool:/var/lib/base2/media-inspector
    restart: 'no'
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 8
    mem_limit: 32m
    cpus: '0.1'

  # Network authority is isolated to the non-root definitions updater. The
  # networkless inspector consumes its read-only signed database volume.
  clamav:
    image: clamav/clamav@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME}_clamav
    profiles: [media-scan]
    user: '100:101'
    entrypoint: ['/usr/bin/freshclam']
    command:
      - --daemon
      - --foreground
      - --stdout
      - --checks=24
      - --user=clamav
      - --config-file=/etc/clamav/freshclam-base2.conf
    networks: [clamav_egress]
    volumes:
      - clamav_db:/var/lib/clamav
      - ./api/config/freshclam.conf:/etc/clamav/freshclam-base2.conf:ro
      - ./api/scripts/clamav_updater_health.sh:/usr/local/bin/base2-clamav-health:ro
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
      - /run:rw,nosuid,nodev,noexec,size=8m
    pids_limit: 32
    # A cold signed-definition test can exceed 512 MiB before FreshClam settles.
    mem_limit: 1024m
    cpus: '0.25'
    healthcheck:
      test: ['CMD', '/bin/sh', '/usr/local/bin/base2-clamav-health']
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

  media-inspector:
    build:
      context: ./api
      dockerfile: Dockerfile.media-inspector
    profiles: [media-scan]
    platform: linux/amd64
    environment:
      - MEDIA_INSPECTOR_SPOOL_ROOT=/var/lib/base2/media-inspector
      - MEDIA_INSPECTOR_SPOOL_PRODUCER_UID=1000
      - MEDIA_INSPECTOR_SPOOL_PRODUCER_GID=1000
      - MEDIA_INSPECTOR_SIGNING_KEY=${MEDIA_INSPECTOR_SIGNING_KEY}
      - MEDIA_INSPECTOR_BUILD_IDENTITY=${MEDIA_INSPECTOR_BUILD_IDENTITY}
    network_mode: none
    ipc: private
    volumes:
      - media_inspector_spool:/var/lib/base2/media-inspector
      - clamav_db:/var/lib/clamav:ro
    restart: unless-stopped
    group_add: ['1000']
    depends_on:
      media-inspector-spool-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m']
    pids_limit: 16
    mem_limit: 1536m
    cpus: '0.75'
    healthcheck:
      test: ['CMD', 'python', '-m', 'api.services.media_inspector_service', '--healthcheck']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Django static files
  nginx-static:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx_static
    volumes:
      - ./nginx/nginx-django-static.conf:/etc/nginx/nginx.conf:ro
      - django_static:/app/static:ro
    networks: [app_network]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8081/health || exit 1']
    mem_limit: 64m
    cpus: '0.25'

  # Traefik (ONLY public ports)
  traefik:
    build:
      context: .
      dockerfile: ./traefik/Dockerfile
      args:
        - TRAEFIK_VERSION=${TRAEFIK_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_traefik
    ports:
      - '80:80'
      - '443:443'
    networks: [app_network]
    volumes:
      - ./letsencrypt:/etc/traefik/acme
      - traefik_logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WEBSITE_DOMAIN=${WEBSITE_DOMAIN:-localhost}
      - TRAEFIK_CERT_EMAIL=${TRAEFIK_CERT_EMAIL}
      - TRAEFIK_CERT_RESOLVER=${TRAEFIK_CERT_RESOLVER:-le-staging}
      - TRAEFIK_PREVIEW_MODE=${TRAEFIK_PREVIEW_MODE:-local}
      - OWNER_ALLOWLIST_CSV=${OWNER_ALLOWLIST_CSV:-127.0.0.1/32}
    secrets:
      - traefik_dash_basic_users
      - flower_basic_users
    restart: unless-stopped
    user: '1000:1000'
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: '0.5'

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app_network]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: '1.0'

  workspace-db-role:
    image: postgres:${POSTGRES_VERSION}
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - PGPORT=${DB_PORT:-5432}
      - PGSSLMODE=${DB_SSLMODE:-disable}
      - PGSSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - WORKSPACE_DB_USER=${WORKSPACE_DB_USER}
      - WORKSPACE_DB_PASSWORD=${WORKSPACE_DB_PASSWORD}
      - WORKSPACE_WORKER_DB_USER=${WORKSPACE_WORKER_DB_USER}
      - WORKSPACE_WORKER_DB_PASSWORD=${WORKSPACE_WORKER_DB_PASSWORD}
      - RUNTIME_WORKER_DB_USER=${RUNTIME_WORKER_DB_USER}
      - RUNTIME_WORKER_DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - API_RUNTIME_DB_USER=${API_RUNTIME_DB_USER}
      - API_RUNTIME_DB_PASSWORD=${API_RUNTIME_DB_PASSWORD}
      - DATA_RIGHTS_WORKER_DB_USER=${DATA_RIGHTS_WORKER_DB_USER}
      - DATA_RIGHTS_WORKER_DB_PASSWORD=${DATA_RIGHTS_WORKER_DB_PASSWORD}
      - EMAIL_WORKER_DB_USER=${EMAIL_WORKER_DB_USER}
      - EMAIL_WORKER_DB_PASSWORD=${EMAIL_WORKER_DB_PASSWORD}
    volumes:
      - ./postgres/bootstrap-workspace-role.sh:/bootstrap-workspace-role.sh:ro
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/bootstrap-workspace-role.sh']
    restart: 'no'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  # pgAdmin (internal-only; routed via Traefik, guarded)
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=${PGADMIN_CONFIG_SERVER_MODE}
      - PGADMIN_CONFIG_PROXY_X_FOR_COUNT=${PGADMIN_CONFIG_PROXY_X_FOR_COUNT:-1}
      - PGADMIN_CONFIG_PROXY_X_PROTO_COUNT=${PGADMIN_CONFIG_PROXY_X_PROTO_COUNT:-1}
      - PGADMIN_CONFIG_PROXY_X_HOST_COUNT=${PGADMIN_CONFIG_PROXY_X_HOST_COUNT:-1}
      - PGADMIN_CONFIG_SESSION_COOKIE_SECURE=${PGADMIN_CONFIG_SESSION_COOKIE_SECURE:-True}
      - PGADMIN_LISTEN_PORT=${PGADMIN_PORT}
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:${PGADMIN_PORT}/misc/ping > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
    # pgAdmin 9.17's authenticated browser bundle can exceed 256 MiB during
    # first-session initialization; an OOM kill surfaces as a Traefik 502.
    mem_limit: 512m
    cpus: '0.75'

  # Redis (internal-only; used by Celery)
  redis:
    image: redis:${REDIS_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [app_network]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
        '--protected-mode',
        'yes',
      ]
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: '0.5'

  # Celery worker (optional; enable with `--profile celery`)
  celery-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    profiles: [celery]
    container_name: ${COMPOSE_PROJECT_NAME}_celery_worker
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - BASE2_PROCESS_ROLE=runtime-worker
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${RUNTIME_WORKER_DB_USER}
      - DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - WORKSPACE_DB_USER=${RUNTIME_WORKER_DB_USER}
      - WORKSPACE_DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - WORKSPACE_WORKER_DB_USER=${RUNTIME_WORKER_DB_USER}
      - WORKSPACE_WORKER_DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - CONTENT_WORKSPACE_STORAGE_ROOT=${CONTENT_WORKSPACE_STORAGE_ROOT}
      - OPERATIONS_ALERTS_ENABLED=${OPERATIONS_ALERTS_ENABLED:-false}
      - OPERATIONS_ALERT_INTEGRITY_KEY_FILE=/run/secrets/operations-alert-integrity-key
      - OPERATIONS_ALERT_RECEIPT_KEY_FILE=/run/secrets/operations-alert-receipt-key
      - OPERATIONS_ALERT_WEBHOOK_URL_FILE=/run/secrets/operations-alert-webhook-url
      - OPERATIONS_RECEIPT_INTEGRITY_KEY_FILE=/run/secrets/operations-receipt-integrity-key
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY}
    networks: [app_network]
    volumes:
      - operations_receipts:/var/lib/base2/operations
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
      - ${OPERATIONS_ALERT_INTEGRITY_KEY_FILE_HOST:-/dev/null}:/run/secrets/operations-alert-integrity-key:ro
      - ${OPERATIONS_ALERT_RECEIPT_KEY_FILE_HOST:-/dev/null}:/run/secrets/operations-alert-receipt-key:ro
      - ${OPERATIONS_ALERT_WEBHOOK_URL_FILE_HOST:-/dev/null}:/run/secrets/operations-alert-webhook-url:ro
      - ${OPERATIONS_RECEIPT_INTEGRITY_KEY_FILE_HOST:-/dev/null}:/run/secrets/operations-receipt-integrity-key:ro
    depends_on:
      media-inspector-spool-init:
        condition: service_completed_successfully
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - 'celery -A api.tasks worker -Q runtime -l $${CELERY_LOG_LEVEL:-INFO} --concurrency=$${CELERY_CONCURRENCY:-2}'
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.operations_runtime import _runtime_heartbeat; raise SystemExit(0 if _runtime_heartbeat(''workers:runtime-worker'', 1)[0] == ''healthy'' else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
    mem_limit: 256m
    cpus: '0.5'

  # Celery beat (optional; enable with `--profile celery`)
  celery-content-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    profiles: [celery]
    container_name: ${COMPOSE_PROJECT_NAME}_celery_content_worker
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - BASE2_PROCESS_ROLE=content-worker
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${WORKSPACE_WORKER_DB_USER}
      - DB_PASSWORD=${WORKSPACE_WORKER_DB_PASSWORD}
      - WORKSPACE_DB_USER=${WORKSPACE_WORKER_DB_USER}
      - WORKSPACE_DB_PASSWORD=${WORKSPACE_WORKER_DB_PASSWORD}
      - WORKSPACE_WORKER_DB_USER=${WORKSPACE_WORKER_DB_USER}
      - WORKSPACE_WORKER_DB_PASSWORD=${WORKSPACE_WORKER_DB_PASSWORD}
      - IDENTITY_ENCRYPTION_KEY=${IDENTITY_ENCRYPTION_KEY}
      - CONTENT_WORKSPACE_STORAGE_ROOT=${CONTENT_WORKSPACE_STORAGE_ROOT}
      - CONTENT_WORKSPACE_STORAGE_KEY=${CONTENT_WORKSPACE_STORAGE_KEY}
      - CONTENT_WORKSPACE_STORAGE_BACKEND=${CONTENT_WORKSPACE_STORAGE_BACKEND:-local}
      - CONTENT_WORKSPACE_S3_ENDPOINT=${CONTENT_WORKSPACE_S3_ENDPOINT:-}
      - CONTENT_WORKSPACE_S3_BUCKET=${CONTENT_WORKSPACE_S3_BUCKET:-}
      - CONTENT_WORKSPACE_S3_REGION=${CONTENT_WORKSPACE_S3_REGION:-}
      - CONTENT_WORKSPACE_S3_ALLOWED_HOSTS=${CONTENT_WORKSPACE_S3_ALLOWED_HOSTS:-}
      - CONTENT_WORKSPACE_S3_ACCESS_KEY_FILE=/run/secrets/content-s3-access-key
      - CONTENT_WORKSPACE_S3_SECRET_KEY_FILE=/run/secrets/content-s3-secret-key
      - MEDIA_INSPECTOR_SPOOL_ROOT=/var/lib/base2/media-inspector
      - MEDIA_INSPECTOR_VERIFY_KEY=${MEDIA_INSPECTOR_VERIFY_KEY}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [app_network]
    volumes:
      - content_workspace_artifacts:/var/lib/base2/content-workspace
      - media_inspector_spool:/var/lib/base2/media-inspector
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
      - ${CONTENT_WORKSPACE_S3_ACCESS_KEY_FILE_HOST:-/dev/null}:/run/secrets/content-s3-access-key:ro
      - ${CONTENT_WORKSPACE_S3_SECRET_KEY_FILE_HOST:-/dev/null}:/run/secrets/content-s3-secret-key:ro
    depends_on:
      media-inspector-spool-init: { condition: service_completed_successfully }
      django: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    entrypoint: [sh, -c]
    command: ['celery -A api.tasks worker -Q content -l INFO --concurrency=2']
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.operations_runtime import _runtime_heartbeat; raise SystemExit(0 if _runtime_heartbeat(''workers:content-worker'', 1)[0] == ''healthy'' else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: '0.75'

  celery-data-rights-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    profiles: [celery]
    container_name: ${COMPOSE_PROJECT_NAME}_celery_data_rights_worker
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - BASE2_PROCESS_ROLE=data-rights-worker
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${DATA_RIGHTS_WORKER_DB_USER}
      - DB_PASSWORD=${DATA_RIGHTS_WORKER_DB_PASSWORD}
      - WORKSPACE_DB_USER=${DATA_RIGHTS_WORKER_DB_USER}
      - WORKSPACE_DB_PASSWORD=${DATA_RIGHTS_WORKER_DB_PASSWORD}
      - IDENTITY_ENCRYPTION_KEY=${IDENTITY_ENCRYPTION_KEY}
      - TOKEN_PEPPER=${TOKEN_PEPPER}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [app_network]
    volumes:
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
    depends_on:
      django: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    entrypoint: [sh, -c]
    command: ['celery -A api.tasks worker -Q data-rights -l INFO --concurrency=1']
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.operations_runtime import _runtime_heartbeat; raise SystemExit(0 if _runtime_heartbeat(''workers:data-rights-worker'', 1)[0] == ''healthy'' else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    cpus: '0.5'

  celery-email-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    profiles: [celery]
    container_name: ${COMPOSE_PROJECT_NAME}_celery_email_worker
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - BASE2_PROCESS_ROLE=email-worker
      - SITE_PROFILE=${SITE_PROFILE:-base2-obsidian}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${EMAIL_WORKER_DB_USER}
      - DB_PASSWORD=${EMAIL_WORKER_DB_PASSWORD}
      - BASE2_EMAIL_ADAPTER=${BASE2_EMAIL_ADAPTER:-disabled}
      - BASE2_EMAIL_SMTP_HOST=${BASE2_EMAIL_SMTP_HOST:-}
      - BASE2_EMAIL_SMTP_PORT=${BASE2_EMAIL_SMTP_PORT:-587}
      - BASE2_EMAIL_SMTP_TIMEOUT_SECONDS=${BASE2_EMAIL_SMTP_TIMEOUT_SECONDS:-10}
      - BASE2_EMAIL_FROM_ADDRESS=${BASE2_EMAIL_FROM_ADDRESS:-}
      - BASE2_EMAIL_SMTP_USERNAME_FILE=/run/secrets/email-smtp-username
      - BASE2_EMAIL_SMTP_PASSWORD_FILE=/run/secrets/email-smtp-password
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
    networks: [app_network]
    volumes:
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
      - ${BASE2_EMAIL_SMTP_USERNAME_FILE_HOST:-/dev/null}:/run/secrets/email-smtp-username:ro
      - ${BASE2_EMAIL_SMTP_PASSWORD_FILE_HOST:-/dev/null}:/run/secrets/email-smtp-password:ro
    depends_on:
      django: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    entrypoint: [sh, -c]
    command: ['celery -A api.tasks worker -Q email -l INFO --concurrency=1']
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/tmp]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.operations_runtime import _runtime_heartbeat; raise SystemExit(0 if _runtime_heartbeat(''workers:email-worker'', 1)[0] == ''healthy'' else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    cpus: '0.5'

  celery-beat:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=${FASTAPI_PYTHON_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_celery_beat
    environment:
      - BASE2_DEPLOYMENT_EPOCH=${BASE2_DEPLOYMENT_EPOCH:-development}
      - ENV=${ENV:-development}
      - BASE2_PROCESS_ROLE=runtime-worker
      - SITE_PROFILE=${SITE_PROFILE:-ember-studio}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${RUNTIME_WORKER_DB_USER}
      - DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - WORKSPACE_DB_USER=${RUNTIME_WORKER_DB_USER}
      - WORKSPACE_DB_PASSWORD=${RUNTIME_WORKER_DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/run/secrets/db-ca.pem}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_LOG_LEVEL=${CELERY_LOG_LEVEL}
    networks: [app_network]
    volumes:
      - ${DB_SSLROOTCERT_HOST:-/dev/null}:/run/secrets/db-ca.pem:ro
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - 'celery -A api.tasks beat -l $${CELERY_LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule'
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from api.services.operations_runtime import _runtime_heartbeat;import sys;sys.exit(0 if _runtime_heartbeat(''schedules'',90)[0] == ''healthy'' else 1)"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
    mem_limit: 128m
    cpus: '0.25'

  # Flower (optional; enable with `--profile celery`; routed via Traefik, guarded)
  flower:
    image: mher/flower:2.0
    container_name: ${COMPOSE_PROJECT_NAME}_flower
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_PORT=5555
    networks: [app_network]
    depends_on:
      redis:
        condition: service_healthy
    command: ['python', '-m', 'flower', 'flower', '--port=5555']
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import http.client, sys; c=http.client.HTTPConnection(''localhost'', 5555, timeout=3); c.request(''GET'', ''/''); r=c.getresponse(); sys.exit(0 if r.status < 500 else 1)"',
        ]
      interval: 20s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: '0.25'

networks:
  app_network:
    name: ${NETWORK_NAME}
  # Outbound definition retrieval only; no application service joins it.
  clamav_egress:
    name: ${COMPOSE_PROJECT_NAME}_clamav_egress
    internal: false

volumes:
  clamav_db:
  content_workspace_artifacts:
  media_inspector_spool:
  operations_receipts:
  postgres_data:
  django_static:
  pgadmin_data:
  traefik_logs:

secrets:
  traefik_dash_basic_users:
    environment: TRAEFIK_DASH_BASIC_USERS
  flower_basic_users:
    environment: FLOWER_BASIC_USERS
